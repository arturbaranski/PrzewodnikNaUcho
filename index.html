<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#143642">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Polski audioprzewodnik GPS. Wybierz kierunek, a telefon opowie, gdy podejdziesz.">
  <title>Przewodnik na ucho</title>
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand">
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <rect width="64" height="64" rx="14" fill="#f3eee6"/>
          <g fill="none" stroke="#8d3d24" stroke-width="3.5" stroke-linecap="round" transform="translate(0 3.5)">
            <path d="M6.5 27c3.2 3.2 3.2 8.4 0 11.6"/>
            <path d="M12.2 21c5.2 4.8 5.2 15 0 19.8"/>
            <path d="M18 15.5c7 6.4 7 22.2 0 28.6"/>
          </g>
          <g fill="none" stroke="#143642" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round" transform="translate(-3.5 3.5)">
            <path d="M33.5 28C31 16 39 7.5 49 8.5c11 1.2 14.5 12 11.5 24-3.2 12.5-13 19.5-22 14.5-7-4-9-13-4.2-17"/>
            <path d="M41 21.5c6.4-1.4 11.6 4 9.2 11-1.8 4.6-6.6 4.4-6.8.2"/>
            <path d="M47 33.5c2 3.2.4 6.2-2.4 5.4"/>
          </g>
        </svg>
        <div>
          <div class="brand-line">
            <h1 id="brand-title">Przewodnik na ucho</h1>
            <span id="brand-version" class="brand-version">1.0</span>
          </div>
          <p id="brand-sub">Wybierz kierunek</p>
        </div>
        <button type="button" class="brand-switch" id="change-destination" data-action="change-destination" hidden>Zmień</button>
      </div>
      <div id="status" class="status" aria-live="polite"><span><i class="dot"></i>GPS wyłączony</span><span></span></div>
    </header>
    <main id="main"></main>
    <div class="dock">
      <nav>
        <button type="button" data-action="change-destination">Start</button>
        <button type="button" data-action="nav" data-view="list">Miejsca</button>
        <button type="button" data-action="nav" data-view="map">Mapa</button>
        <button type="button" data-action="nav" data-view="settings">Ustawienia</button>
      </nav>
    </div>
  </div>
  <div id="sheet" class="sheet" hidden></div>
  <script src="vendor/leaflet/leaflet.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
